<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#171914">
  <title>EsPre · reflejos en tránsito</title>
  <script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header><div><span class="eyebrow">ESTUDIO AR / 01</span><h1>Reflejos en tránsito</h1></div><span class="tag" id="mode">VISTA PREVIA</span></header>
    <section id="preview" aria-label="Vista previa del reflejo metálico sobre el tren"></section>
    <div id="ar" hidden aria-label="Cámara y reflejo sobre la obra física"></div>
    <div class="tracking" id="tracking" role="status" hidden>Encuadrá la imagen del tren</div>
    <section class="controls" aria-label="Controles del reflejo">
      <div class="intro"><span class="eyebrow">DE ABAJO HACIA ARRIBA</span><p>La luz recorre las curvas. La obra permanece.</p></div>
      <div class="row presets" aria-label="Acabado metálico">
        <button data-finish="gold" aria-pressed="true">Oro</button>
        <button data-finish="silver" aria-pressed="false">Plata</button>
        <button data-finish="copper" aria-pressed="false">Cobre</button>
      </div>
      <div class="sliders">
        <label>Recorrido <output id="duration-value">6 s</output><input id="duration" type="range" min="3" max="12" step="0.5" value="6"></label>
        <label>Intensidad <output id="intensity-value">80 %</output><input id="intensity" type="range" min="20" max="100" value="80"></label>
      </div>
      <div class="row actions"><button id="replay">Repetir barrido</button><button id="start" class="primary" disabled>Preparando…</button><button id="stop" hidden>Volver a vista previa</button></div>
      <p id="status" role="status">Cargando la obra y sus recorridos…</p>
      <p id="error" role="alert" hidden></p>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
