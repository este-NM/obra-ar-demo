<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <title>Obra AR — reconocimiento del print</title>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "mindar-image": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image.prod.js",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #ar-container { position: fixed; inset: 0; overflow: hidden; background: #000; }
    #ui { position: fixed; inset: 0; z-index: 20; pointer-events: none; color: #fff5df; }
    #card { position: absolute; left: 14px; right: 14px; top: 14px; max-width: 430px; padding: 12px 14px; border-radius: 15px; background: rgba(0,0,0,.48); border: 1px solid rgba(255,210,125,.22); backdrop-filter: blur(10px); box-sizing: border-box; pointer-events: auto; }
    #title { font-size: 14px; font-weight: 650; color: #ffd27a; margin-bottom: 5px; }
    #status { font-size: 12px; line-height: 1.4; opacity: .9; }
    #progress-wrap { height: 3px; margin-top: 9px; background: rgba(255,255,255,.12); border-radius: 99px; overflow: hidden; }
    #progress { height: 100%; width: 0%; background: linear-gradient(90deg,#a97820,#ffe0a0); transition: width .15s linear; }
    #start { margin-top: 10px; padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255,220,160,.26); background: rgba(255,205,110,.14); color: #fff4da; font-size: 13px; display: none; }
    #start:disabled { opacity: .5; }
    #hint { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); padding: 9px 12px; border-radius: 999px; background: rgba(0,0,0,.44); border: 1px solid rgba(255,220,160,.15); font-size: 12px; white-space: nowrap; opacity: 0; transition: opacity .45s; }
    #hint.show { opacity: 1; }
    #error { margin-top: 8px; color: #ffc5a8; font-size: 12px; display: none; }
    @media (max-width: 520px) { #card { max-width: none; } }
  </style>
</head>
<body>
  <div id="ar-container"></div>
  <div id="ui">
    <div id="card">
      <div id="title">Obra AR — reconocimiento automático</div>
      <div id="status">Preparando el reconocimiento de esta obra…</div>
      <div id="progress-wrap"><div id="progress"></div></div>
      <button id="start">Activar cámara</button>
      <div id="error"></div>
    </div>
    <div id="hint">Buscá el print completo dentro del encuadre</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { Compiler } from 'mindar-image';
    import { MindARThree } from 'mindar-image-three';

    const TARGET_VERSION = 'obra-a3-gold-v1';
    const TARGET_HEIGHT = 0.706380208;
    const statusEl = document.querySelector('#status');
    const progressEl = document.querySelector('#progress');
    const progressWrap = document.querySelector('#progress-wrap');
    const startBtn = document.querySelector('#start');
    const errorEl = document.querySelector('#error');
    const hintEl = document.querySelector('#hint');
    const container = document.querySelector('#ar-container');

    let mindarThree = null;
    let anchor = null;
    let renderer = null;
    let scene = null;
    let camera = null;
    let found = false;
    let foundAt = 0;
    let currentBlobUrl = null;
    let clickUv = new THREE.Vector2(0.5, 0.5);
    let clickAt = -1000;
    let traceMaterial = null;
    let glowMaterial = null;

    const vertexShader = `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;
      varying vec2 vUv;
      uniform sampler2D uTex;
      uniform float uTime;
      uniform float uSinceFound;
      uniform float uFound;
      uniform vec2 uClickUv;
      uniform float uSinceClick;
      uniform float uGlowGain;
      uniform float uBaseGain;

      float gaussian(float x, float width) {
        return exp(-(x*x) / max(0.0001, width*width));
      }

      void main() {
        vec4 tex = texture2D(uTex, vUv);
        if (tex.a < 0.008) discard;

        vec2 centered = vUv - vec2(0.5);
        centered.x *= 1.415668203;
        float radial = length(centered);

        // Al reconocer el print, la aparición comienza en el eje central y se abre hacia afuera.
        float opening = clamp(uSinceFound * 0.22, 0.0, 1.0);
        float frontRadius = opening * 0.92;
        float centralFront = gaussian(radial - frontRadius, 0.040 + 0.012*sin(uTime*1.3));
        float opened = 1.0 - smoothstep(frontRadius - 0.03, frontRadius + 0.06, radial);
        float core = exp(-radial * 9.5) * (0.72 + 0.28*sin(uTime*2.4));

        // Pulsación continua sobre las trazas ya activadas.
        float circuit = 0.5 + 0.5*sin(uTime*3.1 - radial*30.0 + vUv.y*8.0);
        circuit = pow(circuit, 4.0);
        float breathing = 0.74 + 0.26*sin(uTime*1.15);

        // Toque: una irradiación que sólo se vuelve visible donde hay traza.
        vec2 clickDelta = vUv - uClickUv;
        clickDelta.x *= 1.415668203;
        float clickDist = length(clickDelta);
        float clickP = clamp(uSinceClick / 2.25, 0.0, 1.0);
        float clickRadius = clickP * 1.15;
        float clickRing = gaussian(clickDist - clickRadius, 0.032 + 0.018*(1.0-clickP));
        clickRing *= (1.0 - clickP);

        float energy = uBaseGain * (0.12 + opened*0.34 + core*0.86 + centralFront*1.25);
        energy += circuit * opened * breathing * 0.52;
        energy += clickRing * 2.1;
        energy *= uFound;

        vec3 warm = tex.rgb * vec3(1.10, 1.04, 0.92);
        vec3 color = warm * (1.0 + energy*uGlowGain);
        float alpha = tex.a * clamp(energy, 0.0, 1.65);
        gl_FragColor = vec4(color, alpha);
      }
    `;

    function openDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open('obra-ar-cache', 1);
        request.onupgradeneeded = () => request.result.createObjectStore('targets');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function cacheGet(key) {
      try {
        const db = await openDB();
        return await new Promise((resolve, reject) => {
          const tx = db.transaction('targets', 'readonly');
          const req = tx.objectStore('targets').get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      } catch (_) { return null; }
    }

    async function cacheSet(key, value) {
      try {
        const db = await openDB();
        await new Promise((resolve, reject) => {
          const tx = db.transaction('targets', 'readwrite');
          tx.objectStore('targets').put(value, key);
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
        });
      } catch (_) {}
    }

    async function loadImage(url) {
      const image = new Image();
      image.src = url;
      await image.decode();
      return image;
    }

    async function prepareTarget() {
      let buffer = await cacheGet(TARGET_VERSION);
      if (buffer) {
        statusEl.textContent = 'Reconocimiento preparado. Podés activar la cámara.';
        progressEl.style.width = '100%';
        return buffer;
      }

      statusEl.textContent = 'Analizando la obra por primera vez… Esto puede tardar unos segundos.';
      const image = await loadImage('./target.jpg');
      const compiler = new Compiler();
      await compiler.compileImageTargets([image], (progress) => {
        const p = Math.max(1, Math.min(100, progress));
        progressEl.style.width = p.toFixed(1) + '%';
        statusEl.textContent = 'Preparando reconocimiento: ' + Math.round(p) + '%';
      });
      buffer = await compiler.exportData();
      await cacheSet(TARGET_VERSION, buffer);
      progressEl.style.width = '100%';
      statusEl.textContent = 'Reconocimiento preparado. Podés activar la cámara.';
      return buffer;
    }

    function makeMaterial(texture, glowGain, baseGain) {
      return new THREE.ShaderMaterial({
        uniforms: {
          uTex: { value: texture },
          uTime: { value: 0 },
          uSinceFound: { value: 0 },
          uFound: { value: 0 },
          uClickUv: { value: clickUv.clone() },
          uSinceClick: { value: 999 },
          uGlowGain: { value: glowGain },
          uBaseGain: { value: baseGain }
        },
        vertexShader,
        fragmentShader,
        transparent: true,
        depthWrite: false,
        depthTest: false,
        blending: THREE.AdditiveBlending,
        side: THREE.DoubleSide
      });
    }

    async function setupAR(targetBuffer) {
      const blob = new Blob([targetBuffer], { type: 'application/octet-stream' });
      currentBlobUrl = URL.createObjectURL(blob);

      mindarThree = new MindARThree({
        container,
        imageTargetSrc: currentBlobUrl,
        filterMinCF: 0.001,
        filterBeta: 0.01,
        missTolerance: 7,
        warmupTolerance: 5
      });

      ({ renderer, scene, camera } = mindarThree);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.outputColorSpace = THREE.SRGBColorSpace;

      anchor = mindarThree.addAnchor(0);
      const loader = new THREE.TextureLoader();
      const [traceTex, glowTex] = await Promise.all([
        loader.loadAsync('./traces.png'),
        loader.loadAsync('./glow.png')
      ]);
      traceTex.colorSpace = THREE.SRGBColorSpace;
      glowTex.colorSpace = THREE.SRGBColorSpace;
      traceTex.minFilter = THREE.LinearFilter;
      glowTex.minFilter = THREE.LinearFilter;

      traceMaterial = makeMaterial(traceTex, 1.35, 1.0);
      glowMaterial = makeMaterial(glowTex, 1.65, 0.72);

      const geometry = new THREE.PlaneGeometry(1, TARGET_HEIGHT);
      const glowPlane = new THREE.Mesh(geometry, glowMaterial);
      glowPlane.position.z = 0.006;
      glowPlane.scale.set(1.012, 1.012, 1);
      const tracePlane = new THREE.Mesh(geometry, traceMaterial);
      tracePlane.position.z = 0.011;
      anchor.group.add(glowPlane);
      anchor.group.add(tracePlane);

      anchor.onTargetFound = () => {
        found = true;
        foundAt = performance.now() * 0.001;
        statusEl.textContent = 'Obra reconocida — activación desde la centralidad.';
        hintEl.classList.remove('show');
      };
      anchor.onTargetLost = () => {
        found = false;
        statusEl.textContent = 'Print fuera de seguimiento. Volvé a encuadrarlo completo.';
        hintEl.classList.add('show');
      };

      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      let downX = 0, downY = 0, downAt = 0;
      container.addEventListener('pointerdown', (event) => {
        downX = event.clientX; downY = event.clientY; downAt = performance.now();
      });
      container.addEventListener('pointerup', (event) => {
        if (!found || performance.now() - downAt > 420 || Math.hypot(event.clientX-downX, event.clientY-downY) > 18) return;
        pointer.x = (event.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(event.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObject(tracePlane, false);
        if (hits.length && hits[0].uv) {
          clickUv.copy(hits[0].uv);
          clickAt = performance.now() * 0.001;
          for (const material of [traceMaterial, glowMaterial]) {
            material.uniforms.uClickUv.value.copy(clickUv);
          }
        }
      });
    }

    async function initialize() {
      try {
        if (!window.isSecureContext) throw new Error('La cámara requiere abrir el sitio mediante HTTPS.');
        const buffer = await prepareTarget();
        await setupAR(buffer);
        progressWrap.style.display = 'none';
        startBtn.style.display = 'inline-block';
      } catch (error) {
        console.error(error);
        statusEl.textContent = 'No se pudo preparar el reconocimiento.';
        errorEl.textContent = error?.message || String(error);
        errorEl.style.display = 'block';
      }
    }

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      statusEl.textContent = 'Solicitando acceso a la cámara…';
      try {
        await mindarThree.start();
        startBtn.style.display = 'none';
        hintEl.classList.add('show');
        statusEl.textContent = 'Apuntá al print completo. El efecto sólo aparecerá al reconocerlo.';
        renderer.setAnimationLoop(() => {
          const now = performance.now() * 0.001;
          const sinceFound = found ? Math.max(0, now - foundAt) : 0;
          const sinceClick = Math.max(0, now - clickAt);
          const foundMix = found ? 1 : 0;
          for (const material of [traceMaterial, glowMaterial]) {
            material.uniforms.uTime.value = now;
            material.uniforms.uSinceFound.value = sinceFound;
            material.uniforms.uFound.value += (foundMix - material.uniforms.uFound.value) * 0.12;
            material.uniforms.uSinceClick.value = sinceClick;
          }
          renderer.render(scene, camera);
        });
      } catch (error) {
        console.error(error);
        startBtn.disabled = false;
        statusEl.textContent = 'No se pudo iniciar la cámara.';
        errorEl.textContent = 'Abrí el enlace de GitHub Pages en Safari/Chrome y aceptá el permiso de cámara.';
        errorEl.style.display = 'block';
      }
    });

    initialize();
  </script>
</body>
</html>
